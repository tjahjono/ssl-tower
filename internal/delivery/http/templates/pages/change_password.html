{{define "content"}}
<div class="mx-auto max-w-sm">
  <div class="mb-6 text-center">
    <h1 class="text-2xl font-semibold text-white">Change password</h1>
    {{if .Forced}}
      <p class="mt-1 text-sm text-slate-500">Set a new password before continuing — this account was just created or reset.</p>
    {{else}}
      <p class="mt-1 text-sm text-slate-500">You'll be signed out everywhere and need to sign back in.</p>
    {{end}}
  </div>

  {{if .Error}}
    <div class="mb-4 rounded-xl bg-rose-500/10 px-4 py-3 text-sm text-rose-200 ring-1 ring-inset ring-rose-500/25">{{.Error}}</div>
  {{end}}

  <form method="post" action="/account/password" class="space-y-4 rounded-xl border border-white/5 bg-slate-900/40 p-6">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div>
      <label for="current_password" class="field-label mb-1 block">Current password</label>
      <input id="current_password" name="current_password" type="password" required autocomplete="current-password"
             class="w-full rounded-lg border-0 bg-slate-950/60 px-3 py-2 text-sm text-slate-200 ring-1 ring-inset ring-white/10 focus:ring-2 focus:ring-sky-500">
    </div>
    <div>
      <label for="new_password" class="field-label mb-1 block">New password <span class="normal-case text-slate-600">(min. 10 characters)</span></label>
      <input id="new_password" name="new_password" type="password" required minlength="10" autocomplete="new-password"
             class="w-full rounded-lg border-0 bg-slate-950/60 px-3 py-2 text-sm text-slate-200 ring-1 ring-inset ring-white/10 focus:ring-2 focus:ring-sky-500">
    </div>
    <div>
      <label for="confirm_password" class="field-label mb-1 block">Confirm new password</label>
      <input id="confirm_password" name="confirm_password" type="password" required minlength="10" autocomplete="new-password"
             class="w-full rounded-lg border-0 bg-slate-950/60 px-3 py-2 text-sm text-slate-200 ring-1 ring-inset ring-white/10 focus:ring-2 focus:ring-sky-500">
    </div>
    <button type="submit" class="w-full btn-primary px-4 py-2 text-sm">
      Change password
    </button>
  </form>
</div>
{{end}}
