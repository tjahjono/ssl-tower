services:
  postgres:
    image: postgres:16-alpine
    container_name: ssl-generator-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ssl_generator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ssl_generator"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: ssl-generator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # config.Load() no longer applies its own defaults for anything below
      # (see internal/config/config.go) — every one of these has to resolve
      # to a real value. The ${VAR:-default} form here is a Compose-level
      # convenience so `docker compose up --build` still works without a
      # .env file; `make env`/`make docker` populate .env with the same
      # values from .env.example, which take over once that file exists.
      APP_ENV: "${APP_ENV:-development}"
      HTTP_ADDR: "${HTTP_ADDR:-:8080}"
      DATABASE_URL: "${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/ssl_generator?sslmode=disable}"
      DB_MAX_CONNS: "${DB_MAX_CONNS:-10}"
      DB_CONNECT_TIMEOUT: "${DB_CONNECT_TIMEOUT:-10s}"
      ALERT_SWEEP_INTERVAL: "${ALERT_SWEEP_INTERVAL:-12h}"
      EXPIRY_WARNING_DAYS: "${EXPIRY_WARNING_DAYS:-30}"
      EXPIRY_CRITICAL_DAYS: "${EXPIRY_CRITICAL_DAYS:-7}"
      EXPIRY_FINAL_DAYS: "${EXPIRY_FINAL_DAYS:-1}"
      # Alerting is opt-in: leave these unset in .env and the app logs a
      # boot-time warning and simply doesn't send anything. Set SMTP_HOST to
      # enable email, TEAMS_WEBHOOK_URL to enable Teams — independently.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      ALERT_EMAIL_FROM: "${ALERT_EMAIL_FROM:-}"
      ALERT_EMAIL_TO: "${ALERT_EMAIL_TO:-}"
      TEAMS_WEBHOOK_URL: "${TEAMS_WEBHOOK_URL:-}"
      # All three come from .env (created by `make env`, or automatically by
      # `make docker`). Generate the first two by hand with: openssl rand -base64 32
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      SESSION_IDLE_TIMEOUT: "${SESSION_IDLE_TIMEOUT:-12h}"
      SESSION_ABSOLUTE_TIMEOUT: "${SESSION_ABSOLUTE_TIMEOUT:-720h}"
      # False by default for local HTTP; set true once behind TLS.
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      # Bootstraps the first admin account on a clean database — ignored once
      # any account exists. `make env` generates a random password for this.
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_INITIAL_PASSWORD: "${ADMIN_INITIAL_PASSWORD:-}"
      # SLA window (days since approval) before an open certificate request
      # ticket is flagged overdue on the ticket queue.
      TICKET_SLA_DAYS: "${TICKET_SLA_DAYS:-3}"
    ports:
      - "8080:8080"

volumes:
  pgdata:
